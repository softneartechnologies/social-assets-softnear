<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#F7F9FC;--ink:#0F172A;--muted:#475569;--soft:#94A3B8;--blue:#3B8DF0;--yellow:#FFD635;--ysoft:#FFF6D1;
--card:#FFFFFF;--line:#E3E8F0;--db:#E8EFFA;--dy:#F7F5E8;--grey:#EEF1F5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink)}
.page{position:relative;width:1080px;height:1920px;padding:200px 84px 0;display:flex;flex-direction:column}
.deco{position:absolute;border-radius:90px;z-index:0}
.d1{width:620px;height:620px;right:-260px;top:-260px;background:var(--db);opacity:.75}
.d2{width:330px;height:330px;right:-150px;top:-60px;background:var(--dy);border-radius:110px;opacity:.9}
#c{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.footer{position:relative;z-index:1;border-top:2px solid var(--line);height:230px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:92px}
.footer span{font-weight:600;font-size:36px;color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:18px;color:var(--blue);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:30px}
.eyebrow:before{content:"";width:56px;height:9px;border-radius:5px;background:var(--yellow)}
h1{font-family:'Inter Display','Inter';font-weight:700;letter-spacing:-.035em;line-height:1.05;font-size:92px;margin-top:30px}
.hl{position:relative;display:inline-block;z-index:0}
.hl i{position:absolute;left:-4px;right:-4px;bottom:.06em;height:.36em;background:var(--yellow);z-index:-1;transform-origin:left;transform:scaleX(0)}
.op0{opacity:0}
.wipe{position:absolute;left:0;top:0;width:1080px;height:1920px;background:var(--yellow);z-index:50;transform:translateY(100%)}
.wipe:after{content:"";position:absolute;left:84px;top:50%;width:120px;height:14px;border-radius:7px;background:var(--ink)}
/* progress pills */
.pills{display:flex;gap:12px;margin-bottom:46px}
.pills div{flex:1;text-align:center;font-weight:700;font-size:26px;padding:14px 0;border-radius:14px;background:#fff;border:2px solid var(--line);color:var(--soft)}
.pills .done{background:var(--db);border-color:var(--db);color:var(--blue)}
.pills .now{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
/* stage */
.stage{position:relative;height:560px;margin-top:44px;background:#fff;border:2px solid var(--line);border-radius:36px;overflow:hidden}
.abs{position:absolute}
/* verdict cards */
.vcs{display:flex;flex-direction:column;gap:18px;margin-top:26px}
.vc{display:flex;align-items:center;gap:26px;border-radius:26px;padding:24px 30px}
.vc .ic{flex:none;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:32px}
.vc .lb{font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.vc .tx{font-weight:600;font-size:38px;line-height:1.2;letter-spacing:-.01em}
.vc.bad{background:#fff;border:2px solid var(--line)} .vc.bad .ic{background:var(--grey);color:#64748B} .vc.bad .lb{color:var(--soft)} .vc.bad .tx{color:#64748B;font-weight:500}
.vc.good{background:var(--yellow)} .vc.good .ic{background:var(--ink);color:var(--yellow)}
/* mini site */
.mini{position:absolute;background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.mini .b{height:22px;background:var(--grey)}
.mini .h{margin:10px;height:46%;border-radius:10px;background:var(--db)}
.mini .l{margin:8px 10px;height:9px;border-radius:5px;background:#E2E8F0}
.mini .l.s{width:50%}
/* generic */
.chip{display:inline-flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 24px;font-weight:600;font-size:32px}
.tagk{font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase}
</style></head><body>
<div class="page"><div class="deco d1" id="d1"></div><div class="deco d2" id="d2"></div>
<div id="c"></div>
<div class="footer"><img id="logo"><span>softnear.com</span></div>
<div class="wipe" id="wipe"></div></div>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,s,d)=>cl((t-s)/d);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bk=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function rise(el,t,s,d=.5,dy=46){const k=eo(P(t,s,d));el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`}
function pop(el,t,s,d=.5,base=''){const k=P(t,s,d);el.style.opacity=cl(k*3);el.style.transform=`${base} scale(${k?bk(k):0.001})`}
function slideX(el,t,s,d,dx){const k=eo(P(t,s,d));el.style.opacity=cl(k*2);el.style.transform=`translateX(${(1-k)*dx}px)`}
function sweep(el,t,s,d=.45){el.querySelector('i').style.transform=`scaleX(${eio(P(t,s,d))})`}
function typed(el,txt,t,s,cps=14,cursor=true){const n=Math.floor(cl((t-s)*cps,0,txt.length));const blink=cursor&&(Math.floor(t*2.4)%2===0)&&t>=s-.4;
  el.innerHTML=txt.slice(0,n)+(cursor?`<span style="opacity:${blink?1:0};color:var(--blue)">|</span>`:'')}
const hl=s=>s.replace(/==(.+?)==/g,'<span class="hl"><i></i>$1</span>');
const PROG=['Design','Domain','Speed','Google','Leads'];
const pills=n=>`<div class="pills" id="pills">${PROG.map((p,i)=>`<div class="${i+1<n?'done':i+1==n?'now':''}">${p}</div>`).join('')}</div>`;
const vcs=(bad,good)=>`<div class="vcs"><div class="vc bad op0" id="vb"><div class="ic">✕</div><div><div class="lb">₹5,000 website</div><div class="tx">${bad}</div></div></div>
<div class="vc good op0" id="vg"><div class="ic">✓</div><div><div class="lb">₹25,000 website</div><div class="tx">${good}</div></div></div></div>`;
function head(n,topic,title){return pills(n)+`<div class="eyebrow op0" id="eb">Difference ${n}/5 · ${topic}</div><h1 class="op0" id="tt">${hl(title)}</h1>`}
function headAnim(t){rise($('#pills'),t,0.05,.5,-30);rise($('#eb'),t,.15);rise($('#tt'),t,.25);$$('#tt .hl').forEach(h=>sweep(h,t,.75))}
function vcAnim(t,c0,c1){rise($('#vb'),t,c0+.35);rise($('#vg'),t,c1+.35)}
function miniSite(x,y,w,h,extra=''){return `<div class="mini" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}"><div class="b"></div><div class="h"></div><div class="l"></div><div class="l s"></div></div>`}

const S={};
/* ---------------- 1 HOOK ---------------- */
S['01-hook']={html:()=>`
<div class="eyebrow op0" id="eb">Before you pay for a website</div>
<div style="position:relative;height:330px;margin-top:20px">
  <div class="abs" id="tag" style="left:330px;top:10px;width:260px;transform-origin:130px 0">
    <div style="margin:0 auto;width:4px;height:70px;background:var(--ink)"></div>
    <div style="position:relative;background:var(--yellow);border-radius:28px 28px 28px 28px;padding:44px 0 34px;text-align:center;box-shadow:0 18px 40px rgba(15,23,42,.12)">
      <div style="position:absolute;left:50%;top:16px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--bg);border:4px solid var(--ink)"></div>
      <div style="font-family:'Inter Display';font-weight:800;font-size:76px;letter-spacing:-.03em">₹5,000</div>
      <div class="tagk" style="margin-top:4px">website</div></div></div>
</div>
<h1 style="font-size:116px;margin-top:40px"><div class="op0 ln">The ₹5,000</div><div class="op0 ln">website costs</div><div class="op0 ln">you the ${hl('==most.==')}</div></h1>
<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:56px" id="costs">
  <div class="chip op0">↻ Rebuild later</div><div class="chip op0">⌛ Lost customers</div><div class="chip op0">∅ No enquiries</div></div>`,
upd(t,c){rise($('#eb'),t,.1);
  const k=P(t,.05,.6);const sw=t<.05?-90:(-90*(1-eo(k)))+ (k>=1?0:0);
  const a=t<.65?-70*(1-eo(P(t,.05,.6))):24*Math.exp(-(t-.65)*1.1)*Math.sin((t-.65)*5.2);
  $('#tag').style.transform=`rotate(${a}deg)`;$('#tag').style.opacity=cl(t/.2);
  $$('.ln').forEach((l,i)=>rise(l,t,c[0]+i*.14,.5,60));sweep($('.hl'),t,c[0]+.75,.5);
  $$('#costs .chip').forEach((ch,i)=>{const s=c[1]+i*.28;const k=P(t,s,.55);ch.style.opacity=cl(k*3);ch.style.transform=`translateY(${(1-bk(k))*-80}px)`});}};

/* ---------------- 2 SETUP ---------------- */
const rowsBad=['Template','Dev\'s domain','Slow hosting','No SEO','No enquiries'];
const rowsGood=['Custom design','Your domain','Fast hosting','SEO set up','WhatsApp + form'];
function xmock(id,price,rows,good){return `<div class="abs" id="${id}" style="top:30px;width:380px;height:500px">
 <div style="font-family:'Inter Display';font-weight:800;font-size:58px;text-align:center;letter-spacing:-.02em">${price}</div>
 <div style="position:relative;margin-top:18px;height:410px;background:#fff;border:2px solid var(--line);border-radius:26px;overflow:hidden">
  <div style="height:40px;background:var(--grey);display:flex;gap:9px;align-items:center;padding-left:18px"><i style="width:12px;height:12px;border-radius:50%;background:#CBD5E1"></i><i style="width:12px;height:12px;border-radius:50%;background:#CBD5E1"></i><i style="width:12px;height:12px;border-radius:50%;background:#CBD5E1"></i></div>
  <div style="margin:18px;height:150px;border-radius:16px;background:var(--db)"></div>
  <div style="margin:14px 18px;height:16px;border-radius:8px;background:#E2E8F0"></div><div style="margin:14px 18px;width:55%;height:16px;border-radius:8px;background:#E2E8F0"></div>
  <div style="margin:22px 18px;width:42%;height:48px;border-radius:12px;background:var(--blue)"></div>
  <div class="xray" style="position:absolute;inset:0;background:${good?'var(--ink)':'#F1F5F9'};padding:58px 22px 0;clip-path:inset(0 0 100% 0)">
   ${rows.map(r=>`<div style="display:flex;gap:14px;align-items:center;font-weight:600;font-size:28px;margin-bottom:18px;color:${good?'#fff':'#64748B'}"><b style="flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:${good?'var(--yellow)':'#E2E8F0'};color:${good?'var(--ink)':'#64748B'}">${good?'✓':'✕'}</b>${r}</div>`).join('')}
  </div>
  <div class="scan" style="position:absolute;left:0;right:0;height:8px;top:0;background:var(--blue);box-shadow:0 0 30px 8px rgba(59,141,240,.45);opacity:0"></div>
 </div></div>`}
S['02-setup']={html:()=>`
<div class="eyebrow op0" id="eb">₹5,000 vs ₹25,000</div>
<div style="position:relative;height:210px;margin-top:10px"><h1 class="abs" id="ta" style="top:0">They look<br>the same.</h1><h1 class="abs op0" id="tb" style="top:0">But inside:<br>${hl('==5 big differences==')}</h1></div>
<div style="position:relative;height:560px;margin-top:40px">${xmock('ma','₹5,000',rowsBad,false)}${xmock('mb','₹25,000',rowsGood,true).replace('style="top:30px','style="top:30px;left:532px')}
 <div class="abs" id="eq" style="left:404px;top:260px;width:104px;height:104px">
  <div style="position:absolute;left:14px;right:14px;top:30px;height:14px;border-radius:7px;background:var(--blue)"></div>
  <div style="position:absolute;left:14px;right:14px;top:60px;height:14px;border-radius:7px;background:var(--blue)"></div>
  <div id="slash" style="position:absolute;left:46px;top:-4px;width:14px;height:112px;border-radius:7px;background:var(--ink);transform:rotate(28deg) scaleY(0)"></div></div></div>`,
upd(t,c){rise($('#eb'),t,.05);rise($('#ta'),t,.15);
  slideX($('#ma'),t,.1,.6,-420);slideX($('#mb'),t,.25,.6,420);$('#mb').style.left='532px';
  pop($('#eq'),t,1.0,.45);
  const s=c[0];const k=eio(P(t,s,.9));
  $$('.scan').forEach(sc=>{sc.style.top=(k*410)+'px';sc.style.opacity=(t>=s&&k<1)?1:0});
  $$('.xray').forEach(x=>x.style.clipPath=`inset(0 0 ${100-k*100}% 0)`);
  $('#slash').style.transform=`rotate(28deg) scaleY(${eo(P(t,s+.3,.4))})`;
  const sw=P(t,s,.4);$('#ta').style.opacity=1-sw;$('#ta').style.transform=`translateY(${-sw*40}px)`;
  if(t>=s){rise($('#tb'),t,s+.1);sweep($('#tb .hl'),t,s+.6)}}};

/* ---------------- 3 DESIGN ---------------- */
S['03-design']={html:()=>{let g='';const W=240,H=150,G=26,ox=(908-3*W-2*G)/2,oy=(556-3*H-2*G)/2;
 for(let r=0;r<3;r++)for(let q=0;q<3;q++)g+=miniSite(ox+q*(W+G),oy+r*(H+G),W,H,'').replace('class="mini"','class="mini th"');
 return head(1,'Design','Copy-paste or ==made for you?==')+`<div class="stage" id="st">${g}
 <div class="abs op0" id="cl" style="left:24px;bottom:18px;background:var(--grey);border-radius:12px;padding:8px 14px;font-weight:700;font-size:22px;color:#64748B">× 1,000s of sites</div>
 <div class="abs op0" id="cu" style="left:184px;top:58px;width:540px;height:440px;background:#fff;border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 30px 60px rgba(15,23,42,.18)">
  <div style="height:64px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 24px"><b style="color:var(--yellow);font-size:26px;letter-spacing:.08em">YOUR BRAND</b><span style="display:flex;gap:10px"><i style="width:44px;height:10px;border-radius:5px;background:#475569"></i><i style="width:44px;height:10px;border-radius:5px;background:#475569"></i></span></div>
  <div style="position:relative;margin:20px;height:190px;border-radius:20px;background:linear-gradient(120deg,var(--blue),#6AA9F5);overflow:hidden">
   <div style="position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;background:var(--yellow)"></div>
   <div style="position:absolute;left:26px;top:40px;width:230px;height:22px;border-radius:11px;background:#fff"></div><div style="position:absolute;left:26px;top:76px;width:160px;height:22px;border-radius:11px;background:#fff;opacity:.7"></div>
   <div style="position:absolute;left:26px;top:122px;width:140px;height:44px;border-radius:12px;background:var(--ink)"></div></div>
  <div style="display:flex;gap:14px;margin:0 20px">${[0,1,2].map(()=>'<div style="flex:1;height:110px;border-radius:16px;background:var(--ysoft);border:2px solid var(--yellow)"></div>').join('')}</div></div>
 </div>`+vcs('Same template as thousands of sites','Designed around your business')},
upd(t,c){headAnim(t);rise($('#st'),t,.35);
  $$('.th').forEach((e,i)=>{const k=P(t,c[0]+i*.07,.4);const dim=eo(P(t,c[1],.5));e.style.opacity=cl(k*3)*(1-.7*dim);e.style.transform=`scale(${(k?bk(k):0.001)*(1-.12*dim)})`});
  rise($('#cl'),t,c[0]+.7,.4,20);if(t>c[1])$('#cl').style.opacity=1-P(t,c[1],.3);
  pop($('#cu'),t,c[1]+.15,.6);vcAnim(t,c[0],c[1])}};

/* ---------------- 4 DOMAIN ---------------- */
const tog=(l)=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-weight:600;font-size:28px">${l}<span class="sw" style="position:relative;width:76px;height:42px;border-radius:21px;background:#CBD5E1"><i style="position:absolute;top:5px;left:5px;width:32px;height:32px;border-radius:50%;background:#fff"></i></span></div>`;
S['04-domain']={html:()=>head(2,'Domain','Whose name is it ==registered in?==')+`<div class="stage" id="st" style="perspective:1600px">
 <div class="abs op0" id="url" style="left:60px;right:60px;top:40px;height:86px;border:2px solid var(--line);border-radius:43px;background:var(--bg);display:flex;align-items:center;gap:18px;padding:0 30px">
  <span style="width:26px;height:22px;border-radius:5px;background:var(--ink);position:relative;top:6px;box-shadow:0 -14px 0 -6px var(--bg),0 -14px 0 -2px var(--ink)"></span><span id="urlt" style="font-weight:600;font-size:36px"></span></div>
 <div class="abs" id="flip" style="left:110px;right:110px;top:160px;height:360px;transform-style:preserve-3d">
  <div class="abs" style="inset:0;backface-visibility:hidden;background:var(--grey);border-radius:28px;padding:30px 36px">
   <div class="tagk" style="color:var(--soft)">Registered to</div>
   <div style="display:flex;gap:22px;align-items:center;margin-top:18px"><div style="width:92px;height:92px;border-radius:50%;background:#CBD5E1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#64748B">DEV</div>
    <div><div style="font-weight:700;font-size:40px;color:#475569">The developer</div><div style="font-size:28px;color:#64748B;margin-top:4px">Not you</div></div></div>
   <div id="lock" style="display:inline-flex;gap:12px;align-items:center;margin-top:34px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 22px;font-weight:600;font-size:28px;color:#64748B">🔒 You can't move or renew it</div></div>
  <div class="abs" style="inset:0;backface-visibility:hidden;transform:rotateY(180deg);background:var(--yellow);border-radius:28px;padding:30px 36px">
   <div class="tagk">Registered to</div>
   <div style="display:flex;gap:22px;align-items:center;margin-top:18px"><div style="width:92px;height:92px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;color:var(--yellow)">YOU</div>
    <div><div style="font-weight:700;font-size:40px">Your business</div><div style="font-size:28px;margin-top:4px">Full control</div></div></div>
   ${tog('Domain & renewals')}${tog('Business email')}${tog('Move hosting anytime')}</div></div>
 </div>`+vcs("Often in the developer's name",'In your name. You control it'),
upd(t,c){headAnim(t);rise($('#st'),t,.35);rise($('#url'),t,.45);typed($('#urlt'),'yourbusiness.com',t,.7,22,true);
  const f=$('#flip');rise(f,t,c[0]+.1,.5,60);
  const fk=eio(P(t,c[1]+.1,.8));f.style.transform+=` rotateY(${fk*180}deg)`;
  const lk=$('#lock');const sk=P(t,c[0]+1.1,.6);lk.style.transform=`translateX(${Math.sin(sk*Math.PI*6)*(1-sk)*14}px)`;
  $$('.sw').forEach((s,i)=>{const k=eio(P(t,c[1]+1.0+i*.3,.35));s.style.background=k>.5?'var(--ink)':'#CBD5E1';s.querySelector('i').style.left=(5+k*34)+'px'});
  vcAnim(t,c[0],c[1])}};

/* ---------------- 5 SPEED ---------------- */
S['05-speed']={html:()=>head(3,'Speed','Opens instantly or ==keeps loading?==')+`<div class="stage" id="st">
 <div class="abs" style="left:60px;right:60px;top:40px;height:400px;border:2px solid var(--line);border-radius:24px;overflow:hidden;background:#fff">
  <div style="height:44px;background:var(--grey)"></div>
  <div id="bar" style="height:10px;width:0;background:var(--blue)"></div>
  <div id="spin" class="abs" style="left:50%;top:180px;width:96px;height:96px;margin-left:-48px;border-radius:50%;border:12px solid var(--grey);border-top-color:var(--blue)"></div>
  <div id="sk" class="abs" style="left:30px;right:30px;top:80px">${[0,1,2,3].map(i=>`<div class="skb" style="height:${i?28:120}px;margin-bottom:22px;border-radius:14px;background:var(--grey);width:${[100,80,90,55][i]}%"></div>`).join('')}</div>
  <div id="real" class="abs" style="left:30px;right:30px;top:80px">
   <div class="rb" style="height:150px;border-radius:18px;background:linear-gradient(120deg,var(--blue),#6AA9F5)"></div>
   <div style="display:flex;gap:16px;margin-top:20px">${[0,1,2].map(()=>'<div class="rb" style="flex:1;height:110px;border-radius:16px;background:var(--ysoft);border:2px solid var(--yellow)"></div>').join('')}</div></div>
 </div>
 <div class="abs" id="watch" style="right:84px;top:12px;background:var(--ink);color:#fff;border-radius:18px;padding:10px 20px;font-weight:700;font-size:32px;font-variant-numeric:tabular-nums">0.0s</div>
 <div class="abs" id="cust" style="left:60px;top:462px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:28px">
  <span style="width:62px;height:62px;border-radius:50%;background:var(--db);position:relative;overflow:hidden"><i style="position:absolute;left:19px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--blue)"></i><i style="position:absolute;left:9px;top:38px;width:44px;height:40px;border-radius:22px;background:var(--blue)"></i></span><span id="custt">Customer waiting…</span></div>
 </div>`+vcs('Cheap hosting. Slow site','Fast hosting. Opens in a blink'),
upd(t,c){headAnim(t);rise($('#st'),t,.35);
  const bad=t>=c[0]&&t<c[2], good=t>=c[2];
  const el=bad?(t-c[0]):0;
