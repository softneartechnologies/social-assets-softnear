<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
:root{--bg:#F7F9FC;--ink:#0F172A;--muted:#475569;--soft:#94A3B8;--blue:#3B8DF0;--blue2:#2A72CC;--yellow:#FFD635;--ysoft:#FFF6D1;
--card:#FFFFFF;--line:#E3E8F0;--db:#E8EFFA;--dy:#F7F5E8;--grey:#EEF1F5;--water:#CFE3FB}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'Inter','Hind',sans-serif;color:var(--ink)}
.page{position:relative;width:1080px;height:1920px;padding:190px 84px 0;display:flex;flex-direction:column;overflow:hidden}
.deco{position:absolute;border-radius:90px;z-index:0}
.d1{width:620px;height:620px;right:-260px;top:-260px;background:var(--db);opacity:.75}
.d2{width:330px;height:330px;right:-150px;top:-60px;background:var(--dy);border-radius:110px;opacity:.9}
#cw{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:30px}
#c{transform-origin:50% 45%}
.footer{position:relative;z-index:1;border-top:2px solid var(--line);height:230px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:92px}
.footer span{font-weight:600;font-size:36px;color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:18px;color:var(--blue);font-weight:700;letter-spacing:.04em;font-size:34px}
.eyebrow:before{content:"";flex:none;width:56px;height:9px;border-radius:5px;background:var(--yellow)}
h1{font-family:'Inter Display','Hind';font-weight:700;letter-spacing:-.005em;line-height:1.22;font-size:84px;margin-top:24px}
.hl{position:relative;display:inline-block;z-index:0}
.hl i{position:absolute;left:-6px;right:-6px;bottom:.12em;height:.34em;background:var(--yellow);z-index:-1;transform-origin:left;transform:scaleX(0)}
.op0{opacity:0}
.abs{position:absolute}
.wipe{position:absolute;left:0;top:0;width:1080px;height:1920px;background:var(--yellow);z-index:50;transform:translateY(100%)}
.wipe:after{content:"";position:absolute;left:84px;top:50%;width:120px;height:14px;border-radius:7px;background:var(--ink)}
.stage{position:relative;background:#fff;border:2px solid var(--line);border-radius:36px;overflow:hidden}
.card{background:#fff;border:2px solid var(--line);border-radius:30px}
.tagk{font-weight:700;font-size:24px;letter-spacing:.1em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 24px;font-weight:600;font-size:32px}
.vcs{display:flex;flex-direction:column;gap:18px}
.vc{display:flex;align-items:center;gap:26px;border-radius:26px;padding:24px 30px}
.vc .ic{flex:none;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px}
.vc .lb{font-weight:700;font-size:26px;letter-spacing:.02em}
.vc .tx{font-weight:600;font-size:44px;line-height:1.25}
.vc.bad{background:#fff;border:2px solid var(--line)} .vc.bad .ic{background:var(--grey);color:#64748B} .vc.bad .lb{color:var(--soft)} .vc.bad .tx{color:#475569}
.vc.good{background:var(--yellow)} .vc.good .ic{background:var(--ink);color:var(--yellow)}
svg{overflow:visible}
</style></head><body>
<div class="page"><div class="deco d1" id="d1"></div><div class="deco d2" id="d2"></div>
<div id="cw"><div id="c"></div></div>
<div class="footer"><img id="logo"><span>softnear.com</span></div>
<div class="wipe" id="wipe"></div></div>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,s,d)=>cl((t-s)/d);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bk=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function rise(el,t,s,d=.5,dy=46){if(!el)return;const k=eo(P(t,s,d));el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`}
function pop(el,t,s,d=.5,base=''){if(!el)return;const k=P(t,s,d);el.style.opacity=cl(k*3);el.style.transform=`${base} scale(${k?bk(k):0.001})`}
function fade(el,t,s,d=.4){if(el)el.style.opacity=eo(P(t,s,d))}
function out(el,t,s,d=.35,dy=-40){if(!el||t<s)return;const k=eio(P(t,s,d));el.style.opacity=1-k;el.style.transform=`translateY(${k*dy}px)`}
function sweep(el,t,s,d=.45){if(el)el.querySelectorAll('i').forEach(i=>i.style.transform=`scaleX(${eio(P(t,s,d))})`)}
const seg=s=>[...new Intl.Segmenter('hi',{granularity:'grapheme'}).segment(s)].map(x=>x.segment);
function typed(el,txt,t,s,cps=9,cursor=true){const g=seg(txt);const n=Math.floor(cl((t-s)*cps,0,g.length));const blink=cursor&&(Math.floor(t*2.4)%2===0);
  el.innerHTML=g.slice(0,n).join('')+(cursor?`<span style="opacity:${blink?1:0};color:var(--blue);font-weight:400">|</span>`:'')}
const hl=s=>s.replace(/==(.+?)==/g,'<span class="hl"><i></i>$1</span>');

/* ---------- reusable drawings ---------- */
function netSVG(w,h,id,opt={}){ // diamond mesh with top rope + floats
  const step=opt.step||64, sag=opt.sag||0;let L='';let n=0;
  for(let x=-h;x<w+h;x+=step){L+=`<line x1="${x}" y1="0" x2="${x+h}" y2="${h}" pathLength="1"/>`;L+=`<line x1="${x+h}" y1="0" x2="${x}" y2="${h}" pathLength="1"/>`;n++}
  let F='';for(let x=step/2;x<w;x+=step*1.5)F+=`<circle class="fl" cx="${x}" cy="0" r="13"/>`;
  return `<svg id="${id}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
   <defs><clipPath id="${id}-cp"><path d="M0 0 H${w} L${w-28} ${h} Q${w/2} ${h+sag} 28 ${h} Z"/></clipPath></defs>
   <g class="mesh" clip-path="url(#${id}-cp)" fill="none" stroke="#1E3A5F" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">${L}</g>
   <path class="rim" d="M28 ${h} Q${w/2} ${h+sag} ${w-28} ${h}" fill="none" stroke="#1E3A5F" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
   <line class="rope" x1="-10" y1="0" x2="${w+10}" y2="0" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
   <g fill="var(--yellow)" stroke="var(--ink)" stroke-width="4">${F}</g></svg>`}
function drawNet(id,k){const s=document.getElementById(id);if(!s)return;
  s.querySelectorAll('.mesh line').forEach((l,i,a)=>{const st=(i/a.length)*.55;l.style.strokeDashoffset=1-eo(cl((k-st)/.45))});
  s.querySelector('.rope').style.strokeDashoffset=1-eo(cl(k/.35));s.querySelector('.rim').style.strokeDashoffset=1-eo(cl((k-.5)/.5));
  s.querySelectorAll('.fl').forEach((f,i,a)=>{const kk=cl((k-.1-i/a.length*.4)/.2);f.style.transform=`scale(${kk?bk(kk):0})`;f.style.transformOrigin=`${f.getAttribute('cx')}px 0px`;f.style.transformBox='view-box'})}
function wave(w,h,level,amp,ph,len){let d=`M0 ${h} L0 ${level}`;for(let x=0;x<=w;x+=12){d+=` L${x} ${(level+Math.sin(x/len*6.283+ph)*amp+Math.sin(x/(len*.47)*6.283-ph*1.3)*amp*.35).toFixed(1)}`}return d+` L${w} ${h} Z`}
function fish(id,col='var(--yellow)'){return `<svg class="abs fish" id="${id}" width="90" height="46" viewBox="0 0 90 46"><path d="M8 23 Q34 0 64 23 Q34 46 8 23 Z" fill="${col}" stroke="var(--ink)" stroke-width="3.5"/><path d="M62 23 L86 7 L86 39 Z" fill="${col}" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/><circle cx="22" cy="20" r="3.5" fill="var(--ink)"/></svg>`}
function browser(w,h,id,inner=''){return `<div class="abs" id="${id}" style="width:${w}px;height:${h}px;background:#fff;border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 26px 60px rgba(15,23,42,.14)">
 <div style="height:52px;background:var(--grey);display:flex;gap:10px;align-items:center;padding-left:22px;border-bottom:2px solid var(--line)"><i style="width:14px;height:14px;border-radius:50%;background:#CBD5E1"></i><i style="width:14px;height:14px;border-radius:50%;background:#CBD5E1"></i><i style="width:14px;height:14px;border-radius:50%;background:#CBD5E1"></i>
 <span style="margin-left:18px;flex:1;margin-right:22px;height:28px;border-radius:14px;background:#fff"></span></div>${inner}</div>`}
const siteBody=`<div style="margin:22px;height:150px;border-radius:18px;background:linear-gradient(120deg,var(--blue),#6AA9F5)"></div>
 <div style="margin:16px 22px;height:18px;border-radius:9px;background:#E2E8F0"></div><div style="margin:16px 22px;width:58%;height:18px;border-radius:9px;background:#E2E8F0"></div>
 <div style="margin:24px 22px;width:40%;height:54px;border-radius:14px;background:var(--yellow)"></div>`;
function coin(id,x,y,s=1){return `<div class="abs coin" id="${id}" style="left:${x}px;top:${y}px;width:${58*s}px;height:${58*s}px;border-radius:50%;background:var(--yellow);border:${4*s}px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${30*s}px;font-family:Inter">₹</div>`}
function heart(id){return `<svg class="abs hrt" id="${id}" width="46" height="42" viewBox="0 0 46 42"><path d="M23 40 C6 27 2 18 2 12 C2 5 8 1 13 1 C18 1 21 4 23 8 C25 4 28 1 33 1 C38 1 44 5 44 12 C44 18 40 27 23 40 Z" fill="#F43F5E" stroke="var(--ink)" stroke-width="3"/></svg>`}

const S={};
/* ---------- 1 HOOK ---------- */
S['01-hook']={html:()=>`
<div class="eyebrow op0" id="eb">Got a website, but no customers?</div>
<div class="op0" id="l1" style="margin-top:40px;font-weight:600;font-size:60px;color:var(--muted)">We build websites.</div>
<div class="op0" id="l2" style="margin-top:8px;font-weight:600;font-size:60px;color:var(--muted)">And we&#39;re telling you:</div>
<h1 id="big" style="font-size:118px;line-height:1.08;margin-top:36px;letter-spacing:-.03em"><div class="op0 bw">A website alone</div><div class="op0 bw">${hl('==won&#39;t bring==')}</div><div class="op0 bw">customers.</div></h1>
<div class="card op0" id="an" style="margin-top:56px;padding:26px 32px;display:flex;align-items:center;gap:28px">
 <div style="width:74px;height:74px;border-radius:20px;background:var(--db);display:flex;align-items:flex-end;justify-content:center;gap:7px;padding-bottom:16px">
  <i style="width:11px;height:12px;border-radius:3px;background:var(--soft)"></i><i style="width:11px;height:8px;border-radius:3px;background:var(--soft)"></i><i style="width:11px;height:5px;border-radius:3px;background:var(--soft)"></i></div>
 <div style="flex:1"><div style="font-weight:600;font-size:30px;color:var(--soft)">Enquiries today</div><div id="cnt" style="font-family:Inter;font-weight:800;font-size:64px;line-height:1">0</div></div>
 <div class="tagk" style="color:#E11D48;background:#FFE4E6;border-radius:12px;padding:10px 16px">Live</div></div>`,
upd(t,c){rise($('#eb'),t,.05);rise($('#l1'),t,c[0],.45);rise($('#l2'),t,c[1],.45);
  $$('.bw').forEach((b,i)=>{const s=c[2]+i*.12;const k=P(t,s,.28);b.style.opacity=cl(k*2.5);b.style.transform=`scale(${1+(1-eo(k))*.9})`;b.style.transformOrigin='left center'});
  sweep($('#big'),t,c[2]+.55,.4);
  const sh=t>c[2]+.36&&t<c[2]+.75?Math.sin(t*90)*7*(1-P(t,c[2]+.36,.39)):0;$('#big').style.transform=`translateX(${sh}px)`;
  rise($('#an'),t,c[2]+.85,.5);$('#cnt').textContent='0';}};

/* ---------- 2 NET ---------- */
S['02-net']={html:()=>`
<div class="eyebrow op0" id="eb">Straight talk</div>
<div style="position:relative;height:330px;margin-top:6px">
 <h1 class="abs op0" id="ta" style="top:0;font-size:96px;letter-spacing:-.03em">Your website =<br>${hl('==a fishing net==')}</h1>
 <h1 class="abs op0" id="tb" style="top:0;font-size:84px;letter-spacing:-.03em">However good the net,<br>it has to go<br>${hl('==in the water.==')}</h1></div>
<div class="stage op0" id="st" style="height:860px;margin-top:30px;background:#fff">
 <svg class="abs" id="wv" width="912" height="860" style="left:0;top:0"><path id="w1" fill="var(--water)"/><path id="w2" fill="var(--blue)" opacity=".28"/></svg>
 ${browser(640,440,'br',siteBody)}
 <div class="abs" id="nw" style="left:136px;top:150px">${netSVG(640,400,'net',{step:58,sag:60})}</div>
 ${fish('f1')}${fish('f2','#fff')}${fish('f3')}
 <div class="abs" id="spl" style="left:0;top:0"></div>
</div>`,
upd(t,c){rise($('#eb'),t,.05);rise($('#ta'),t,.15);sweep($('#ta'),t,c[0],.5);rise($('#st'),t,.25,.6,80);
  const br=$('#br');br.style.left='136px';br.style.top='150px';
  const m=P(t,c[1],1.0);br.style.opacity=1-eio(P(t,c[1]+.35,.6));br.style.transform=`scale(${1-.06*eio(m)})`;
  drawNet('net',P(t,c[1],1.4));
  out($('#ta'),t,c[2]);if(t>=c[2]){rise($('#tb'),t,c[2]+.1);sweep($('#tb'),t,c[2]+.7)}
  const H=860,W=912;const lv=H-eio(P(t,c[3]-.35,1.1))*430;
  $('#w1').setAttribute('d',wave(W,H,lv,16,t*2.2,520));$('#w2').setAttribute('d',wave(W,H,lv+34,12,-t*1.7+1,380));
  const drop=eio(P(t,c[3],.9));const bob=t>c[3]+.9?Math.sin((t-c[3])*2.6)*8:0;
  $('#nw').style.transform=`translateY(${drop*250+bob}px)`;
  const sp=P(t,c[3]+.55,.7);let h='';if(sp>0&&sp<1){for(let i=0;i<14;i++){const a=-Math.PI*(.15+.7*rnd(i));const r=60+220*rnd(i+9);const x=456+Math.cos(a)*r*sp*1.4;const y=lv-10+Math.sin(a)*r*sp+500*sp*sp;
    h+=`<i style="position:absolute;left:${x}px;top:${y}px;width:${14+12*rnd(i+3)}px;height:${14+12*rnd(i+3)}px;border-radius:50%;background:var(--blue);opacity:${1-sp}"></i>`}}$('#spl').innerHTML=h;
  [['#f1',1.0,640,.8],['#f2',1.6,700,-.9],['#f3',2.2,600,.7]].forEach(([id,o,y,dir])=>{const f=$(id);const s=c[3]+.8+o*.4;const k=t-s;
    f.style.opacity=cl(k*2);const x=dir>0?-120+k*150:960-k*150;f.style.left=x+'px';f.style.top=(y+Math.sin(k*3)*10)+'px';f.style.transform=dir>0?'scaleX(-1)':'none'});}};

/* ---------- 3 WATER ---------- */
function chan(n,id,title,line,tags,icon){return `<div class="card op0 ch" id="${id}" style="position:relative;display:flex;gap:30px;align-items:center;padding:34px 30px 52px;overflow:hidden">
 <div style="position:relative;flex:none;width:210px;height:210px;border-radius:26px;background:var(--db);overflow:hidden">${icon}</div>
 <div style="flex:1;position:relative;z-index:2"><div class="tagk" style="color:var(--blue)">Water ${n} · ${tags}</div>
  <div style="font-family:'Inter Display','Hind';font-weight:700;font-size:72px;line-height:1.1;margin-top:6px;letter-spacing:-.02em">${title}</div>
  <div style="font-weight:600;font-size:40px;color:var(--muted);margin-top:2px">${hl(line)}</div></div>
 <svg class="abs" style="left:0;bottom:0" width="912" height="40"><path class="cw" fill="var(--water)"/></svg></div>`}
S['03-water']={html:()=>`
<div class="eyebrow op0" id="eb">Where&#39;s the water?</div>
<h1 class="op0" id="tt" style="font-size:96px;letter-spacing:-.03em">It&#39;s in ${hl('==3 places==')}</h1>
<div style="display:flex;flex-direction:column;gap:30px;margin-top:44px">
${chan(1,'c1','Ads','costs ==money==','Meta · Google Ads',`<div class="abs" style="left:30px;top:118px;width:150px;height:70px;border-radius:16px;background:#fff;border:3px solid var(--ink)"><div style="margin:12px 14px 0;height:10px;width:70%;border-radius:5px;background:var(--line)"></div><div style="margin:10px 14px;height:20px;width:46%;border-radius:6px;background:var(--blue)"></div></div><div id="coins"></div>`)}
${chan(2,'c2','Google','costs ==time==','SEO',`<svg class="abs" style="left:35px;top:20px" width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" fill="#fff" stroke="var(--ink)" stroke-width="6"/><line id="hh" x1="70" y1="70" x2="70" y2="38" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><line id="mh" x1="70" y1="70" x2="70" y2="22" stroke="var(--blue)" stroke-width="5" stroke-linecap="round"/><circle cx="70" cy="70" r="7" fill="var(--yellow)" stroke="var(--ink)" stroke-width="3"/></svg>
 <div class="abs" style="left:24px;top:160px;width:162px;height:38px;border-radius:19px;background:#fff;border:3px solid var(--ink);font-family:Inter;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center">Rank <span id="rk" style="margin-left:8px;color:var(--blue2)">#48</span></div>`)}
${chan(3,'c3','Social media','costs ==effort==','Instagram · Facebook · LinkedIn',`<div class="abs" style="left:55px;top:22px;width:100px;height:170px;border-radius:18px;background:#fff;border:3px solid var(--ink);padding:16px 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-content:start">${[0,1,2,3,4,5].map(i=>`<i class="tile" style="height:36px;border-radius:6px;background:${i%3==1?'var(--yellow)':'var(--blue)'};opacity:0"></i>`).join('')}</div><div id="hearts"></div>`)}
</div>`,
upd(t,c){rise($('#eb'),t,.05);rise($('#tt'),t,.15);sweep($('#tt'),t,.65);
  ['#c1','#c2','#c3'].forEach((id,i)=>{rise($(id),t,c[i],.55,90);sweep($(id),t,c[i]+.6,.45);const on=t>=c[i];$(id).style.borderColor=(t>=c[i]&&(i==2||t<c[i+1]))?'var(--blue)':'var(--line)'});
  $$('.cw').forEach((p,i)=>p.setAttribute('d',wave(912,40,18,7,t*2.4+i,300)));
  let ch='';const s0=c[0]+.4;for(let i=0;i<12;i++){const st=s0+i*.42;const k=(t-st);if(k>0&&k<1.1){const y=-70+k*k*190;ch+=coin('k'+i,62+((i*53)%70),Math.min(y,96),.8).replace('class="abs coin"',`class="abs coin" style2`)}}
  $('#coins').innerHTML=ch;
  const tc=Math.max(0,t-c[1]-.3);$('#mh').setAttribute('transform',`rotate(${tc*360} 70 70)`);$('#hh').setAttribute('transform',`rotate(${tc*30} 70 70)`);
  const rk=Math.round(48-45*eio(P(t,c[1]+.4,2.4)));$('#rk').textContent='#'+rk;
  $$('.tile').forEach((ti,i)=>{const k=P(t,c[2]+.35+i*.22,.25);ti.style.opacity=k;ti.style.transform=`scale(${k?bk(k):0})`});
  let hh='';for(let i=0;i<9;i++){const st=c[2]+.6+i*.3;const k=t-st;if(k>0&&k<1.3){const x=120+30*Math.sin(i*2.1)+k*18;const y=150-k*120;hh+=`<div class="abs" style="left:${x}px;top:${y}px;opacity:${cl(1.3-k)};transform:scale(${.6+.5*cl(k*3)})">${heart('h'+i)}</div>`}}$('#hearts').innerHTML=hh;}};

/* ---------- 4 DRY ---------- */
S['04-dry']={html:()=>`
<div class="eyebrow op0" id="eb">Built a website and waited?</div>
<h1 style="font-size:84px;letter-spacing:-.03em"><div class="op0" id="a1">…and just sat back?</div><div class="op0" id="a2" style="color:var(--muted);font-size:64px;margin-top:8px">You&#39;ve got a beautiful net —</div></h1>
<div class="stage op0" id="st" style="height:760px;margin-top:40px;background:linear-gradient(#FBFAF6,#F4EFE3)">
 <svg class="abs" style="left:700px;top:60px" width="150" height="150" viewBox="-75 -75 150 150"><g id="sun">${[...Array(12)].map((_,i)=>`<line x1="0" y1="-52" x2="0" y2="-70" stroke="#F5B400" stroke-width="7" stroke-linecap="round" transform="rotate(${i*30})"/>`).join('')}</g><circle r="40" fill="var(--yellow)" stroke="#F5B400" stroke-width="5"/></svg>
 <div class="abs" style="left:0;right:0;top:520px;bottom:0;background:#E9DFC9"></div>
 <svg class="abs" style="left:0;top:520px" width="912" height="240"><g id="cracks" fill="none" stroke="#B9A684" stroke-width="5" stroke-linecap="round">
  <path pathLength="1" d="M80 30 L140 70 L120 120 L190 170"/><path pathLength="1" d="M330 20 L300 80 L360 110 L340 190"/><path pathLength="1" d="M560 40 L620 90 L600 150"/><path pathLength="1" d="M760 30 L720 100 L790 140 L770 210"/><path pathLength="1" d="M140 70 L230 60"/><path pathLength="1" d="M620 90 L700 80"/></g></svg>
